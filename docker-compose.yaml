services:
  gateway:
    container_name: gateway-service
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - offer
      - user
      - recruitment

  auth:
    container_name: auth-servicels
    
    build:
      context: .
      dockerfile: Auth/Dockerfile
    environment:
      Services__UserUrl: "http://user:8080/"
      InternalApiKey: "dev-internal-key-change-me"
    depends_on:
      - db
      - user

  offer:
    container_name: offer-service
    build:
      context: .
      dockerfile: Offer/Dockerfile
    depends_on:
      - db

  user:
    container_name: user-service
    build:
      context: .
      dockerfile: User/Dockerfile
    environment:
      InternalApiKey: "dev-internal-key-change-me"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=user_db;Username=postgres;Password=admin123"
      Services__AiUrl: "http://ai:8080/"
    depends_on:
      - db
      - ai

  recruitment:
    container_name: recruitment-service
    build:
      context: .
      dockerfile: Recruitment/Dockerfile
    environment:
      InternalApiKey: "dev-internal-key-change-me"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=recruitment_db;Username=postgres;Password=admin123"
      Services__OfferUrl: "http://offer:8080/"
      Services__UserUrl: "http://user:8080/"
      Services__AiUrl: "http://ai:8080/"
    depends_on:
      - db
      - offer
      - user
      - ai

  ai:
    container_name: ai-service
    build:
      context: .
      dockerfile: AI/Dockerfile
    environment:
      Llm__Url: "http://host.docker.internal:1234/api/v1/chat"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:17-alpine
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: