$kind: http-request
method: GET
url: '{{baseUrl}}/offer/offers?searchTerm={{runId}}&category=1&minSalary=10000'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));

      pm.test("Finds the new offer", () =>
          pm.expect(pm.response.json().map(o => o.id)).to.include(pm.collectionVariables.get('offerId')));
