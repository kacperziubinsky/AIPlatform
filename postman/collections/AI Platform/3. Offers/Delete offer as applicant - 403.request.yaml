$kind: http-request
method: DELETE
url: '{{baseUrl}}/offer/offers/{{offerId}}'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", () => pm.response.to.have.status(403));
