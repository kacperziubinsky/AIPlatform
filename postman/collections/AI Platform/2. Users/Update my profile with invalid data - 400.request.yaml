$kind: http-request
method: PUT
url: '{{baseUrl}}/user/api/users/me'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstname": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
      "lastname": "Testowy",
      "experience": 99
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
