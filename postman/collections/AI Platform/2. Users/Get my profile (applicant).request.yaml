$kind: http-request
method: GET
url: '{{baseUrl}}/user/api/users/me'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test("Profile was created on registration and has an id", () => pm.expect(body.id).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('applicantId', body.id);
