$kind: http-request
method: GET
url: '{{baseUrl}}/user/api/users'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));

      pm.test("Contains the new applicant", () =>
          pm.expect(pm.response.json().map(u => u.id)).to.include(pm.collectionVariables.get('applicantId')));
