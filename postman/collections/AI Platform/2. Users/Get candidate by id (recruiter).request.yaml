$kind: http-request
method: GET
url: '{{baseUrl}}/user/api/users/{{applicantId}}'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Is the applicant", () => pm.expect(pm.response.json().lastname).to.eql("Testowy"));
