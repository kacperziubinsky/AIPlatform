$kind: http-request
method: POST
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}/evaluations'
order: 16000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
    "score": 80,
    "comment": "Good technical interview."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.test("Source is Recruiter", () => pm.expect(pm.response.json().source).to.eql("Recruiter"));
