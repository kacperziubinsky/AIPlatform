$kind: http-request
method: GET
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterBToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
