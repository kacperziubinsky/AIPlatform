$kind: http-request
method: POST
url: '{{baseUrl}}/recruitment/api/applications'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "offerId": "{{$guid}}",
      "cvId": "{{cvId}}",
      "coverLetter": "Chętnie dołączę do zespołu."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
