$kind: http-request
method: GET
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}'
order: 10000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Has the chosen CV", () => pm.expect(pm.response.json().cvId).to.eql(pm.collectionVariables.get("cvId")));
