$kind: http-request
method: POST
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}/evaluations'
order: 17000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterBToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
    "score": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
