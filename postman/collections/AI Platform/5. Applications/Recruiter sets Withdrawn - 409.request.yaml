$kind: http-request
method: PATCH
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}/status'
order: 13000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
    "status": "Withdrawn"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
