$kind: http-request
method: GET
url: '{{baseUrl}}/recruitment/api/offers/{{offerId}}/applications'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterBToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Sees nothing", () => pm.expect(pm.response.json()).to.be.an("array").that.is.empty);
