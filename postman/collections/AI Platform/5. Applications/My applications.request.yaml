$kind: http-request
method: GET
url: '{{baseUrl}}/recruitment/api/applications/me'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));

      pm.test("Contains the application", () =>
          pm.expect(pm.response.json().map(a => a.id)).to.include(pm.collectionVariables.get('applicationId')));
