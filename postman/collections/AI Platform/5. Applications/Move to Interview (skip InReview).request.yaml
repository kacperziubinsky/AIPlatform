$kind: http-request
method: PATCH
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}/status'
order: 11000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterToken}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "status": "Interview",
      "note": "Strong CV, invite to a call."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
