$kind: http-request
method: POST
url: '{{baseUrl}}/recruitment/api/applications/{{applicationId}}/ai-evaluation'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{recruiterBToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
