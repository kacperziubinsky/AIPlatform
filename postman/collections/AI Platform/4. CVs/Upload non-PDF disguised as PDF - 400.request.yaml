$kind: http-request
method: POST
url: '{{baseUrl}}/user/api/users/me/cvs'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: 'postman/fixtures/not-a-pdf.pdf'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
