$kind: http-request
method: DELETE
url: '{{baseUrl}}/user/api/users/me/cvs/{{cvId}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{applicantToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
