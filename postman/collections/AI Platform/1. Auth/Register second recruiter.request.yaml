$kind: http-request
method: POST
url: '{{baseUrl}}/auth/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "recruiter.b.{{runId}}@example.com",
      "password": "{{password}}",
      "role": "Recruiter"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set('recruiterBToken', pm.response.json().token);
