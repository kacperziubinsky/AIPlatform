$kind: http-request
method: POST
url: '{{baseUrl}}/auth/auth/login'
order: 7000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "APPLICANT.{{runId}}@EXAMPLE.COM",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set('applicantToken', pm.response.json().token);
