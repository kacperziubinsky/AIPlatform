$kind: http-request
method: POST
url: '{{baseUrl}}/auth/auth/register'
order: 6000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "short.{{runId}}@example.com",
      "password": "abc",
      "role": "Applicant"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
