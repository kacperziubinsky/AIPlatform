$kind: http-request
method: POST
url: '{{baseUrl}}/auth/auth/login'
order: 9000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "nobody.{{runId}}@example.com",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
